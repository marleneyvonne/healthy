<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Healthy">

<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2024%2024%22%3E%3Cpath%20d%3D%22M9.6%204.2%207.8%202.2M14.4%204.2l1.8-2%22%20fill%3D%22none%22%20stroke%3D%22%231d1a1b%22%20stroke-width%3D%221.4%22%20stroke-linecap%3D%22round%22/%3E%3Ccircle%20cx%3D%2212%22%20cy%3D%226.6%22%20r%3D%223.3%22%20fill%3D%22%231d1a1b%22/%3E%3Ccircle%20cx%3D%2212%22%20cy%3D%2214.2%22%20r%3D%227.6%22%20fill%3D%22%23d7263d%22/%3E%3Cpath%20d%3D%22M12%207.2v14.6%22%20stroke%3D%22%231d1a1b%22%20stroke-width%3D%221.2%22/%3E%3Ccircle%20cx%3D%228.6%22%20cy%3D%2211.6%22%20r%3D%221.5%22%20fill%3D%22%231d1a1b%22/%3E%3Ccircle%20cx%3D%2215.4%22%20cy%3D%2211.6%22%20r%3D%221.5%22%20fill%3D%22%231d1a1b%22/%3E%3Ccircle%20cx%3D%227.8%22%20cy%3D%2216.2%22%20r%3D%221.3%22%20fill%3D%22%231d1a1b%22/%3E%3Ccircle%20cx%3D%2216.2%22%20cy%3D%2216.2%22%20r%3D%221.3%22%20fill%3D%22%231d1a1b%22/%3E%3Ccircle%20cx%3D%2210%22%20cy%3D%2219.4%22%20r%3D%221%22%20fill%3D%22%231d1a1b%22/%3E%3Ccircle%20cx%3D%2214%22%20cy%3D%2219.4%22%20r%3D%221%22%20fill%3D%22%231d1a1b%22/%3E%3Ccircle%20cx%3D%2210.6%22%20cy%3D%225.6%22%20r%3D%22.7%22%20fill%3D%22%23fff%22/%3E%3Ccircle%20cx%3D%2213.4%22%20cy%3D%225.6%22%20r%3D%22.7%22%20fill%3D%22%23fff%22/%3E%3C/svg%3E">
<title>Healthy</title>
<style>
:root{--bg:#f7f3f0;--card:#fff;--ink:#2a2125;--muted:#85767c;--line:#ebe2dd;--accent:#a3335a;--accent-ink:#fff;--soft:#f6e2e9;--mid:#e3a6bb;--period:#c23f69;--spot:#efbccb;--danger:#b3261e;color-scheme:light dark}
@media (prefers-color-scheme:dark){:root{--bg:#151113;--card:#211b1e;--ink:#f2eaed;--muted:#a8999f;--line:#342b2f;--accent:#e57c9f;--accent-ink:#1b1215;--soft:#3a2630;--mid:#7e4459;--period:#de6990;--spot:#6e3c4d;--danger:#ff8a80}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
button:disabled{opacity:.3;cursor:default}
input,textarea,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:11px 13px;width:100%;outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--accent)}
textarea{resize:vertical;min-height:80px}
h1,h2,h3{margin:0;font-weight:650;letter-spacing:-.01em}
h3{font-size:15px;margin-bottom:10px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
p{margin:0 0 10px}
.hint{font-size:12.5px;font-weight:400;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:13.5px}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* Sperrbildschirm */
.lock{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px}
.lock-box{width:100%;max-width:380px;text-align:center}
.logo{width:64px;height:64px;border-radius:20px;background:var(--soft);display:grid;place-items:center;margin:0 auto 18px}
.logo svg{width:40px;height:40px}
.lock h1{font-size:26px;margin-bottom:8px}
.lock form{display:grid;gap:10px;margin-top:22px;text-align:left}
.warn{font-size:13px;background:var(--soft);border-radius:12px;padding:10px 12px}
.err{color:var(--danger);font-size:14px;min-height:20px;margin:0}
.divider{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px;margin:22px 0 12px}
.divider:before,.divider:after{content:"";flex:1;height:1px;background:var(--line)}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--accent);color:var(--accent-ink);border-radius:14px;padding:13px 18px;font-weight:600}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--danger);border:1px solid currentColor}
.btn.full{width:100%}
.link{color:var(--accent);font-size:14px;font-weight:500}
.icon-btn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center}
.icon-btn:active{background:var(--soft)}
label.btn input{display:none}

/* App-Gerüst */
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;padding:calc(8px + env(safe-area-inset-top)) 12px 8px 20px;background:var(--bg);border-bottom:1px solid var(--line)}
.brand{font-weight:700;font-size:18px}
main{max-width:560px;margin:0 auto;padding:14px 16px calc(100px + env(safe-area-inset-bottom))}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;justify-content:center;background:var(--card);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
.tabs button{flex:1;max-width:140px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;color:var(--muted);padding:6px 0;border-radius:12px}
.tabs button[aria-current=true]{color:var(--accent);font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px;font-size:15px;display:inline-flex;align-items:center;gap:6px;transition:background .15s,border-color .15s}
.chip.on,.chip.lv3{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip.lv1{background:var(--soft);border-color:var(--mid)}
.chip.lv2{background:var(--mid);border-color:var(--mid)}
.chip .lv{font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;opacity:.8}
.chip.add{border-style:dashed;color:var(--muted)}
.scale{display:grid;grid-template-columns:repeat(11,1fr);gap:4px}
.scale .chip{padding:8px 0;justify-content:center;font-size:14px}
.scale-l{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:6px}
.inline{display:flex;align-items:center;gap:10px;margin-top:12px}
.inline input{width:110px;flex:none}
.inline span{color:var(--muted);font-size:14px}
.stats.two{grid-template-columns:repeat(2,1fr)}
.row{display:flex;gap:10px;align-items:center}
.row>*{flex:1}

/* Tagesansicht */
.datenav{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.datelabel{text-align:center}
.dl-main{font-weight:650;font-size:17px}
.dl-sub{font-size:13px;color:var(--muted)}
.center{display:block;margin:0 auto 10px}
.hero{background:var(--accent);color:var(--accent-ink);border:0}
.hero .big{font-size:30px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.hero .sub{opacity:.9;font-size:14.5px;margin-top:4px}
.hero .note{opacity:.75;font-size:12.5px;margin-top:8px}

/* Kalender */
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.cal-head h2{font-size:18px}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.wd{text-align:center;font-size:12px;color:var(--muted);padding:4px 0}
.day{position:relative;aspect-ratio:1;border-radius:12px;display:grid;place-items:center;font-size:15px;border:2px solid transparent}
.day.out{visibility:hidden}
.day.future{color:var(--muted)}
.day.period{background:var(--period);color:#fff;font-weight:600}
.day.spot{background:var(--spot)}
.day.pred{border:2px dashed var(--period)}
.day.today{box-shadow:inset 0 0 0 2px var(--ink)}
.day.dot:after{content:"";position:absolute;bottom:5px;width:5px;height:5px;border-radius:50%;background:currentColor;opacity:.7}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12.5px;color:var(--muted);margin-top:12px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:14px;height:14px;border-radius:5px;display:inline-block}

/* Auswertung */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px}
.stat b{display:block;font-size:24px;letter-spacing:-.02em}
.stat span{font-size:12px;color:var(--muted)}
.cyc{display:grid;grid-template-columns:78px 1fr 44px;gap:10px;align-items:center;font-size:13.5px;margin:8px 0}
.bar{height:12px;border-radius:6px;background:var(--soft);position:relative;overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0;background:var(--period);border-radius:6px}
.bar.open{background:repeating-linear-gradient(90deg,var(--soft) 0 6px,transparent 6px 10px)}
.symrow{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:14.5px}
.symrow:first-of-type{border-top:0}

/* Mehr */
.set{display:grid;gap:10px}
details summary{cursor:pointer;color:var(--accent);font-size:14px;font-weight:500}
details ol{padding-left:20px;margin:10px 0 0;font-size:13.5px}
details li{margin-bottom:6px}
code{font-size:12.5px;background:var(--soft);padding:1px 5px;border-radius:5px}
.tag{display:inline-flex;align-items:center;gap:6px;background:var(--soft);border-radius:999px;padding:5px 6px 5px 12px;font-size:14px}
.tag button{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:14px}

/* Modal & Toast */
.modal{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.4);display:flex;align-items:flex-end;justify-content:center;padding:16px}
@media (min-width:600px){.modal{align-items:center}}
.modal[hidden]{display:none}
.sheet{width:100%;max-width:420px;background:var(--card);border-radius:22px;padding:20px;display:grid;gap:12px;margin-bottom:env(safe-area-inset-bottom)}
.sheet h3{font-size:18px;margin:0}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:30;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<div id="lock" class="lock"></div>

<div id="app" hidden>
  <header class="top">
    <div class="brand">Healthy</div>
    <button class="icon-btn" data-act="lock" aria-label="Sperren" title="Sperren">
      <svg class="i" viewBox="0 0 24 24"><rect x="5" y="10.5" width="14" height="10" rx="2.5"/><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5"/></svg>
    </button>
  </header>
  <main>
    <section id="v-tag" class="view"></section>
    <section id="v-kal" class="view" hidden></section>
    <section id="v-aus" class="view" hidden></section>
    <section id="v-mehr" class="view" hidden></section>
  </main>
  <nav class="tabs">
    <button data-view="tag"><svg class="i" viewBox="0 0 24 24"><path d="M10 5 8.3 3M14 5l1.7-2"/><path d="M9.2 7.6a2.8 2.8 0 0 1 5.6 0"/><circle cx="12" cy="14.2" r="6.8"/><path d="M12 7.4v13.6"/><circle cx="9" cy="12.4" r=".9" fill="currentColor"/><circle cx="15" cy="12.4" r=".9" fill="currentColor"/><circle cx="9.2" cy="16.6" r=".9" fill="currentColor"/><circle cx="14.8" cy="16.6" r=".9" fill="currentColor"/></svg>Eintrag</button>
    <button data-view="kal"><svg class="i" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>Kalender</button>
    <button data-view="aus"><svg class="i" viewBox="0 0 24 24"><path d="M5 20v-8M12 20V5M19 20v-5"/></svg>Auswertung</button>
    <button data-view="mehr"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/></svg>Mehr</button>
  </nav>
</div>

<div id="modal" class="modal" hidden></div>
<div id="toast" class="toast" role="status"></div>

<script>
"use strict";
/* =========================================================
   Healthy – alles bleibt auf diesem Gerät.
   Speicher: IndexedDB, verschlüsselt mit AES-GCM (256 Bit).
   Schlüssel: aus deinem Passwort per PBKDF2-SHA256 abgeleitet.
   Keine Server, keine Analyse, keine externen Bibliotheken.
   ========================================================= */

const ITER = 310000;
const DB_NAME = 'healthy', STORE = 'vault';

const SYMPTOMS = ['Krämpfe','Kopfschmerzen','Brustspannen','Blähungen','Rückenschmerzen','Übelkeit','Müdigkeit','Akne','Heißhunger','Schlafprobleme','Stimmungsschwankungen','Durchfall','Verstopfung','Schwindel'];
const FLOWS = [['','Keine'],['schmier','Schmierblutung'],['leicht','Leicht'],['mittel','Mittel'],['stark','Stark']];
const MOODS = [['gut','😊 Gut'],['ok','🙂 Okay'],['muede','😴 Müde'],['gereizt','😤 Gereizt'],['traurig','😢 Traurig'],['aengstlich','😟 Ängstlich']];
const LV = ['', 'leicht', 'mittel', 'stark'];
const SLEEPQ = ['', 'Schlecht', 'Mäßig', 'Gut', 'Sehr gut'];
const ENERGY = ['', 'Erschöpft', 'Niedrig', 'Mittel', 'Gut', 'Voller Energie'];
const MOVES = ['Spaziergang','Laufen','Radfahren','Krafttraining','Yoga','Schwimmen','Tanzen'];

const S = { key:null, salt:null, data:null, date:null, month:null, view:'tag', lastAct:Date.now(), hiddenAt:0 };

/* ---------- Hilfsfunktionen ---------- */
const $ = s => document.querySelector(s);
const pad = n => String(n).padStart(2,'0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const today = () => ymd(new Date());
const addDays = (s,n) => { const d = parse(s); d.setDate(d.getDate()+n); return ymd(d); };
const diff = (a,b) => Math.round((parse(b) - parse(a)) / 86400000);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtLong = s => parse(s).toLocaleDateString('de-DE', {weekday:'long', day:'numeric', month:'long'});
const fmtShort = s => parse(s).toLocaleDateString('de-DE', {day:'numeric', month:'short'});
const mean = a => a.reduce((x,y)=>x+y,0) / a.length;
const median = a => { const b=[...a].sort((x,y)=>x-y); const m=b.length>>1; return b.length%2 ? b[m] : (b[m-1]+b[m])/2; };
const isIOS = () => /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toast.t); toast.t=setTimeout(()=>t.classList.remove('show'), 2600); }

/* ---------- IndexedDB ---------- */
function idb(){ return new Promise((res,rej)=>{ const r=indexedDB.open(DB_NAME,1); r.onupgradeneeded=()=>r.result.createObjectStore(STORE); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }
async function idbReq(mode, fn){ const db=await idb(); return new Promise((res,rej)=>{ const r=fn(db.transaction(STORE,mode).objectStore(STORE)); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }
const idbGet = k => idbReq('readonly', s=>s.get(k));
const idbSet = (k,v) => idbReq('readwrite', s=>s.put(v,k));
const idbDel = k => idbReq('readwrite', s=>s.delete(k));

/* ---------- Verschlüsselung ---------- */
const enc = new TextEncoder(), dec = new TextDecoder();
const b64 = u => { let s=''; for (let i=0;i<u.length;i+=0x8000) s+=String.fromCharCode.apply(null, u.subarray(i,i+0x8000)); return btoa(s); };
const unb64 = s => Uint8Array.from(atob(s), c=>c.charCodeAt(0));

async function deriveKey(pw, salt, iter=ITER){
  const base = await crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2', salt, iterations:iter, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, false, ['encrypt','decrypt']);
}
async function encryptJSON(key, salt, obj){
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({name:'AES-GCM', iv}, key, enc.encode(JSON.stringify(obj)));
  return { v:1, iter:ITER, salt:b64(salt), iv:b64(iv), ct:b64(new Uint8Array(ct)) };
}
async function decryptJSON(key, blob){
  const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:unb64(blob.iv)}, key, unb64(blob.ct));
  return JSON.parse(dec.decode(pt));
}

/* ---------- Daten ---------- */
function normalize(d){
  d = d && typeof d === 'object' ? d : {};
  d.version = 1;
  d.entries = d.entries || {};
  d.customSymptoms = d.customSymptoms || [];
  d.customMoves = d.customMoves || [];
  d.meds = d.meds || [];
  d.settings = Object.assign({ autoLock:5 }, d.settings || {});
  return d;
}
const blankEntry = () => ({ flow:'', sym:{}, mood:[], note:'', sleepH:'', sleepQ:0, energy:0, pain:'', move:[], moveMin:'', meds:[] });
function getEntry(d){ const e = S.data.entries[d] || {}; return { ...blankEntry(), ...e, sym:{...(e.sym||{})}, mood:[...(e.mood||[])], move:[...(e.move||[])], meds:[...(e.meds||[])] }; }
function setEntry(d, patch){ S.data.entries[d] = { ...getEntry(d), ...patch, u:Date.now() }; save(); }
const hasContent = e => e && (e.flow || hasHealth(e));
const hasHealth = e => e && (Object.keys(e.sym||{}).length || (e.mood||[]).length || e.note || e.sleepH || e.sleepQ || e.energy || e.pain !== undefined && e.pain !== '' || (e.move||[]).length || e.moveMin || (e.meds||[]).length);
const uniq = a => [...new Set(a)];
const allSymptoms = () => uniq([...SYMPTOMS, ...S.data.customSymptoms]);
const allMoves = e => uniq([...MOVES, ...S.data.customMoves, ...(e ? e.move : [])]);
const allMeds = e => uniq([...S.data.meds, ...(e ? e.meds : [])]);
const num = v => { const n = parseFloat(String(v).replace(',', '.')); return isFinite(n) ? n : null; };
const deNum = (n, k=1) => n.toLocaleString('de-DE', { maximumFractionDigits:k });

let saveTimer;
function save(){ clearTimeout(saveTimer); saveTimer = setTimeout(saveNow, 300); }
async function saveNow(){
  clearTimeout(saveTimer);
  if (!S.key || !S.data) return;
  try { await idbSet('vault', await encryptJSON(S.key, S.salt, S.data)); }
  catch(e){ toast('Speichern fehlgeschlagen: ' + e.message); }
}

/* ---------- Zyklus-Berechnung ---------- */
const isPeriod = f => f === 'leicht' || f === 'mittel' || f === 'stark';

function cycleInfo(){
  const E = S.data.entries;
  const days = Object.keys(E).filter(k => isPeriod(E[k].flow)).sort();
  const periods = [];
  for (const d of days){
    const last = periods[periods.length-1];
    if (last && diff(last.end, d) <= 2) last.end = d;   // 1 Tag Pause zählt noch zur selben Periode
    else periods.push({ start:d, end:d });
  }
  const starts = periods.map(p => p.start);
  const cycles = [];
  for (let i=1;i<starts.length;i++) cycles.push({ start:starts[i-1], len:diff(starts[i-1], starts[i]), plen:diff(periods[i-1].start, periods[i-1].end)+1 });
  const valid = cycles.filter(c => c.len >= 15 && c.len <= 60).slice(-6);
  const avgCycle = valid.length ? Math.round(mean(valid.map(c=>c.len))) : 28;
  const recentP = periods.slice(-6).map(p => diff(p.start,p.end)+1);
  const avgPeriod = recentP.length ? Math.round(mean(recentP)) : 5;
  const lastStart = starts[starts.length-1] || null;
  const t = today();
  const cycleDay = lastStart ? diff(lastStart, t) + 1 : null;
  const nextStart = lastStart ? addDays(lastStart, avgCycle) : null;
  const lastP = periods[periods.length-1];
  const inPeriod = lastP && diff(lastP.end, t) <= 1 && diff(lastP.start, t) < 12;
  return { periods, starts, cycles, valid, avgCycle, avgPeriod, lastStart, cycleDay, nextStart, inPeriod, lastP };
}
function cycleDayFor(d, starts){
  let s = null;
  for (const x of starts){ if (x <= d) s = x; else break; }
  return s ? diff(s, d) + 1 : null;
}
function predictedDays(c){
  const set = new Set();
  if (!c.lastStart) return set;
  const t = today();
  for (let i=0;i<3;i++){
    const st = addDays(c.nextStart, i*c.avgCycle);
    for (let j=0;j<c.avgPeriod;j++){ const k = addDays(st, j); if (k >= t) set.add(k); }
  }
  return set;
}

function dialog(html, collect){

async function showLock(){
  $('#app').hidden = true;
  const L = $('#lock'); L.hidden = false;
  if (!window.crypto || !crypto.subtle || !window.indexedDB){
    L.innerHTML = `<div class="lock-box">${LOGO}<h1>Nicht verfügbar</h1><p class="muted">Dieser Browser erlaubt hier keine sichere Verschlüsselung. Öffne die App über ihre https-Adresse (oder als Datei in Chrome/Edge/Safari).</p></div>`;
    return;
  }
  let has = false; try { has = !!(await idbGet('vault')); } catch(e){}
  if (!has){
    L.innerHTML = `<div class="lock-box">${LOGO}
      <h1>Healthy</h1>
      <p class="muted">Deine Daten bleiben nur auf diesem Gerät – verschlüsselt mit deinem Passwort.</p>
      <form id="setup">
        <input type="password" id="pw1" autocomplete="new-password" placeholder="Passwort (mind. 8 Zeichen)" required>
        <input type="password" id="pw2" autocomplete="new-password" placeholder="Passwort wiederholen" required>
        <div class="warn">Wenn du das Passwort vergisst, kann niemand die Daten wiederherstellen – auch du nicht.</div>
        <p class="err" id="err"></p>
        <button class="btn full" type="submit">Tagebuch anlegen</button>
      </form>
      <div class="divider">oder</div>
      <label class="btn ghost full">Backup wiederherstellen<input type="file" id="restoreFile" accept=".json,application/json"></label>
    </div>`;
    $('#setup').onsubmit = async e => {
      e.preventDefault();
      const a=$('#pw1').value, b=$('#pw2').value;
      if (a.length < 8) return $('#err').textContent = 'Bitte mindestens 8 Zeichen.';
      if (a !== b) return $('#err').textContent = 'Die Passwörter stimmen nicht überein.';
      $('#err').textContent = 'Wird eingerichtet …';
      S.salt = crypto.getRandomValues(new Uint8Array(16));
      S.key = await deriveKey(a, S.salt);
      S.data = normalize({});
      await saveNow();
      enterApp();
    };
    $('#restoreFile').onchange = e => { const f=e.target.files[0]; e.target.value=''; if (f) importFile(f, 'restore'); };
  } else {
    L.innerHTML = `<div class="lock-box">${LOGO}
      <h1>Gesperrt</h1>
      <form id="unlock">
        <input type="password" id="pw" autocomplete="current-password" placeholder="Passwort" required>
        <p class="err" id="err"></p>
        <button class="btn full" type="submit">Entsperren</button>
      </form>
      <p style="margin-top:22px"><button class="link" id="forgot">Passwort vergessen?</button></p>
    </div>`;
    setTimeout(()=>$('#pw') && $('#pw').focus(), 50);
    $('#unlock').onsubmit = async e => {
      e.preventDefault();
      $('#err').textContent = 'Entsperre …';
      try {
        const blob = await idbGet('vault');
        const salt = unb64(blob.salt);
        const key = await deriveKey($('#pw').value, salt, blob.iter || ITER);
        const data = await decryptJSON(key, blob);
        S.key = key; S.salt = salt; S.data = normalize(data);
        enterApp();
      } catch(err){ $('#err').textContent = 'Falsches Passwort.'; $('#pw').select(); }
    };
    $('#forgot').onclick = wipeAll;
  }
}

function enterApp(){
  const L = $('#lock'); L.hidden = true; L.innerHTML = '';

  S.date = today();
  const n = new Date(); S.month = new Date(n.getFullYear(), n.getMonth(), 1);

}

async function lock(){
  await saveNow();
  S.key = null; S.data = null; S.salt = null;
  document.querySelectorAll('.view').forEach(v => v.innerHTML = '');

  showLock();
}

async function wipeAll(){
  const ok = await confirmBox('Alles löschen?', 'Alle Einträge auf diesem Gerät werden endgültig gelöscht. Das lässt sich nicht rückgängig machen – außer du hast ein Backup.', 'Endgültig löschen');

  await idbDel('vault');
  S.key = null; S.data = null; S.salt = null;
  document.querySelectorAll('.view').forEach(v => v.innerHTML = '');

  toast('Alle Daten gelöscht');
}

function heroCard(c){
  if (!c.lastStart) return `<div class="card hero"><div class="big">Willkommen</div><div class="sub">Trag den ersten Tag deiner Periode ein – dann rechnet die App mit.</div></div>`;
  const t = today();
  const until = diff(t, c.nextStart);
  let sub;
  if (c.inPeriod) sub = `Periodentag ${diff(c.lastP.start, t)+1}`;
  else if (until > 1) sub = `Nächste Periode ca. ${fmtShort(c.nextStart)} · in ${until} Tagen`;
  else if (until === 1) sub = `Nächste Periode ca. morgen`;
  else if (until === 0) sub = `Periode heute erwartet`;
  else sub = `Periode ${-until} ${-until===1?'Tag':'Tage'} später als geschätzt`;
  const note = c.valid.length ? `Ø ${c.avgCycle} Tage aus ${c.valid.length} ${c.valid.length===1?'Zyklus':'Zyklen'}` : 'Schätzung mit 28 Tagen – wird genauer, sobald zwei Perioden eingetragen sind.';
  return `<div class="card hero"><div class="big">Zyklustag ${c.cycleDay}</div><div class="sub">${sub}</div><div class="note">${note}</div></div>`;
}

function renderKal(){
  const m = S.month, y = m.getFullYear(), mo = m.getMonth();
  const c = cycleInfo(), pred = predictedDays(c), E = S.data.entries, t = today();
  const offset = (new Date(y,mo,1).getDay() + 6) % 7;
  const dim = new Date(y, mo+1, 0).getDate();
  let cells = '';
  for (let i=0;i<offset;i++) cells += `<div class="day out"></div>`;
  for (let dd=1; dd<=dim; dd++){
    const k = `${y}-${pad(mo+1)}-${pad(dd)}`, e = E[k] || {};
    const cls = ['day'];
    if (isPeriod(e.flow)) cls.push('period'); else if (e.flow==='schmier') cls.push('spot'); else if (pred.has(k)) cls.push('pred');
    if (hasHealth(e)) cls.push('dot');
    if (k === t) cls.push('today');
    if (k > t) cls.push('future');
    cells += k > t ? `<div class="${cls.join(' ')}">${dd}</div>` : `<button class="${cls.join(' ')}" data-day="${k}">${dd}</button>`;
  }
  const isCur = y === new Date().getFullYear() && mo === new Date().getMonth();
  $('#v-kal').innerHTML = `
    <div class="card">
      <div class="cal-head">
        <button class="icon-btn" data-act="mprev" aria-label="Vorheriger Monat"><svg class="i" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>

function renderAus(){
  const c = cycleInfo(), E = S.data.entries, t = today();
  const recent = c.cycles.slice(-8).reverse();
  const maxLen = Math.max(40, ...recent.map(x=>x.len), c.cycleDay||0);
  const rows = [];
  if (c.lastStart){
    const plen = diff(c.lastP.start, c.lastP.end) + 1;
    rows.push(`<div class="cyc"><span>${fmtShort(c.lastStart)}</span><div class="bar open"><i style="width:${Math.min(100,plen/maxLen*100)}%"></i></div><span class="muted">läuft</span></div>`);
  }
  for (const x of recent) rows.push(`<div class="cyc"><span>${fmtShort(x.start)}</span><div class="bar"><i style="width:${x.plen/maxLen*100}%"></i></div><span><b>${x.len}</b> T</span></div>`);

  const stats = {};
  for (const [d,e] of Object.entries(E)){
    for (const s of Object.keys(e.sym||{})){
      (stats[s] ||= {n:0, days:[]}).n++;
      const cd = cycleDayFor(d, c.starts); if (cd && cd <= 60) stats[s].days.push(cd);
    }
  }
  const top = Object.entries(stats).sort((a,b)=>b[1].n-a[1].n).slice(0,10);

  // Letzte 30 Tage – allgemeine Gesundheit
  const last = Array.from({length:30}, (_,i) => E[addDays(t, -i)]).filter(Boolean);
  const avgOf = (arr) => arr.length ? mean(arr) : null;
  const sleepH = last.map(e => num(e.sleepH)).filter(n => n !== null && n > 0 && n <= 24);
  const energy = last.map(e => e.energy).filter(Boolean);
  const pains = last.map(e => e.pain).filter(p => typeof p === 'number');
  const activeDays = last.filter(e => (e.move||[]).length || num(e.moveMin) > 0).length;
  const minutes = last.reduce((sum,e) => sum + (num(e.moveMin) || 0), 0);
  const medCount = {};
  for (const e of last) for (const m of e.meds||[]) medCount[m] = (medCount[m]||0) + 1;
  const sAvg = avgOf(sleepH), eAvg = avgOf(energy), pAvg = avgOf(pains);
  const health = `
    <div class="card"><h3>Gesundheit <span class="hint">letzte 30 Tage</span></h3>
      <div class="stats two" style="margin:0">
        <div class="stat"><b>${sAvg!==null?deNum(sAvg)+' h':'–'}</b><span>Ø Schlaf${sleepH.length?' ('+sleepH.length+' Nächte)':''}</span></div>
        <div class="stat"><b>${eAvg!==null?deNum(eAvg)+' / 5':'–'}</b><span>Ø Energie</span></div>
        <div class="stat"><b>${pains.filter(p=>p>0).length}</b><span>Tage mit Schmerzen${pAvg!==null?' · Ø '+deNum(pAvg):''}</span></div>
        <div class="stat"><b>${activeDays}</b><span>aktive Tage${minutes?' · '+deNum(minutes,0)+' Min.':''}</span></div>
      </div>
    </div>
    <div class="card"><h3>Medikamente <span class="hint">letzte 30 Tage</span></h3>
      ${Object.keys(medCount).length ? Object.entries(medCount).sort((a,b)=>b[1]-a[1]).map(([m,n]) => `<div class="symrow"><span>${esc(m)}</span><span class="muted">an ${n} ${n===1?'Tag':'Tagen'}</span></div>`).join('') : '<p class="muted small">Noch keine Einnahmen eingetragen.</p>'}
    </div>`;

  $('#v-aus').innerHTML = `
    <div class="stats">
      <div class="stat"><b>${c.valid.length?c.avgCycle:'–'}</b><span>Ø Zykluslänge</span></div>
      <div class="stat"><b>${c.periods.length?c.avgPeriod:'–'}</b><span>Ø Periodendauer</span></div>
      <div class="stat"><b>${c.cycles.length}</b><span>erfasste Zyklen</span></div>
    </div>
    <div class="card"><h3>Zyklen <span class="hint">rot = Periode</span></h3>
      ${rows.length ? rows.join('') : '<p class="muted small">Noch keine Periode eingetragen.</p>'}
    </div>
    ${health}
    <div class="card"><h3>Häufigste Symptome</h3>
      ${top.length ? top.map(([s,v]) => `<div class="symrow"><span>${esc(s)}</span><span class="muted">${v.n}× ${v.days.length>=2?'· meist um Zyklustag '+Math.round(median(v.days)):''}</span></div>`).join('') : '<p class="muted small">Noch keine Symptome eingetragen.</p>'}
    </div>
    <p class="muted small">Die Prognose ist eine einfache Durchschnittsrechnung. Sie ist keine Verhütungsmethode und ersetzt keine ärztliche Beratung.</p>
  `;
}

      <p class="muted small" style="margin:0">Diese App hat keinen Server, keine Analyse und kein Tracking. Netzwerkverbindungen sind per Content-Security-Policy gesperrt. Deine Einträge liegen verschlüsselt (AES-256) nur im Speicher dieses Browsers.</p>
    </div>
    <button class="btn danger full" data-act="wipe">Alle Daten auf diesem Gerät löschen</button>
  `;
}

/* ---------- Aktionen ---------- */
async function exportBackup(){
  await saveNow();
  const blob = await encryptJSON(S.key, S.salt, S.data);
  const name = `healthy-backup-${today()}.json`;
  const content = JSON.stringify({ app:'healthy', ...blob });
  const file = new File([content], name, { type:'application/json' });
  if (isIOS() && navigator.canShare && navigator.canShare({ files:[file] })){
    try { await navigator.share({ files:[file], title:'Healthy-Backup' }); return; }
    catch(e){ if (e.name === 'AbortError') return; }
  }
  const url = URL.createObjectURL(file);
  const a = document.createElement('a'); a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
  toast('Backup gespeichert');
}

async function importFile(file, mode){
  let obj;
  try { obj = JSON.parse(await file.text()); if (!obj.ct || !obj.iv || !obj.salt) throw 0; }
  catch(e){ return toast('Das ist keine gültige Backup-Datei.'); }
  const pw = await askPassword('Backup entschlüsseln', 'Gib das Passwort ein, mit dem das Backup erstellt wurde.');
  if (!pw) return;
  let data, key, salt;
  try { salt = unb64(obj.salt); key = await deriveKey(pw, salt, obj.iter || ITER); data = normalize(await decryptJSON(key, obj)); }
  catch(e){ return toast('Falsches Passwort.'); }
  if (mode === 'restore'){
    S.key = key; S.salt = salt; S.data = data;
    await saveNow(); enterApp();
    return toast('Backup wiederhergestellt – es gilt das Passwort des Backups.');
  }
  let n = 0;
  for (const [d,e] of Object.entries(data.entries)){
    const cur = S.data.entries[d];
    if (!cur || (e.u||0) > (cur.u||0)){ S.data.entries[d] = e; n++; }
  }
  for (const list of ['customSymptoms','customMoves','meds']) for (const s of data[list]) if (!S.data[list].includes(s)) S.data[list].push(s);
  await saveNow(); render();
  toast(n ? `${n} ${n===1?'Tag':'Tage'} übernommen` : 'Alles war schon aktuell');
}

async function changePassword(){
  const vals = await dialog(`<h3>Passwort ändern</h3>
    <input type="password" id="p0" autocomplete="current-password" placeholder="Aktuelles Passwort">
    <input type="password" id="p1" autocomplete="new-password" placeholder="Neues Passwort (mind. 8 Zeichen)">
    <input type="password" id="p2" autocomplete="new-password" placeholder="Neues Passwort wiederholen">`,
    m => ({ p0:m.querySelector('#p0').value, p1:m.querySelector('#p1').value, p2:m.querySelector('#p2').value }));
  if (!vals) return;
  if (vals.p1.length < 8) return toast('Neues Passwort: mindestens 8 Zeichen.');
  if (vals.p1 !== vals.p2) return toast('Die neuen Passwörter stimmen nicht überein.');
  try { const blob = await idbGet('vault'); await decryptJSON(await deriveKey(vals.p0, unb64(blob.salt), blob.iter||ITER), blob); }
  catch(e){ return toast('Aktuelles Passwort ist falsch.'); }
  S.salt = crypto.getRandomValues(new Uint8Array(16));
  S.key = await deriveKey(vals.p1, S.salt);
  await saveNow();
  toast('Passwort geändert. Alte Backups brauchen weiter das alte Passwort.');
}

/* ---------- Ereignisse ---------- */
$('#app').addEventListener('click', async ev => {
  const b = ev.target.closest('button'); if (!b || !S.data) return;
  const ds = b.dataset;
  if (ds.view) return switchView(ds.view);
  if (ds.day){ S.date = ds.day; return switchView('tag'); }
  if ('flow' in ds){ const e = getEntry(S.date); setEntry(S.date, { flow: (e.flow === ds.flow) ? '' : ds.flow }); return renderTag(); }
  if ('sym' in ds){
    const e = getEntry(S.date), s = ds.sym, lv = ((e.sym[s]||0) + 1) % 4;
    if (lv) e.sym[s] = lv; else delete e.sym[s];
    setEntry(S.date, { sym:e.sym }); return renderTag();
  }
  if (ds.mood){
    const e = getEntry(S.date);
    const mood = e.mood.includes(ds.mood) ? e.mood.filter(x=>x!==ds.mood) : [...e.mood, ds.mood];
    setEntry(S.date, { mood }); return renderTag();
  }
  if (ds.energy){ const e = getEntry(S.date), v = +ds.energy; setEntry(S.date, { energy: e.energy === v ? 0 : v }); return renderTag(); }
  if (ds.sq){ const e = getEntry(S.date), v = +ds.sq; setEntry(S.date, { sleepQ: e.sleepQ === v ? 0 : v }); return renderTag(); }
  if ('pain' in ds){ const e = getEntry(S.date), v = +ds.pain; setEntry(S.date, { pain: e.pain === v ? '' : v }); return renderTag(); }
  if (ds.move){ const e = getEntry(S.date); setEntry(S.date, { move: e.move.includes(ds.move) ? e.move.filter(x=>x!==ds.move) : [...e.move, ds.move] }); return renderTag(); }
  if (ds.med){ const e = getEntry(S.date); setEntry(S.date, { meds: e.meds.includes(ds.med) ? e.meds.filter(x=>x!==ds.med) : [...e.meds, ds.med] }); return renderTag(); }
  if (ds.dellist){
    const list = ds.dellist, s = S.data[list][+ds.idx];
    if (await confirmBox(`„${esc(s)}“ entfernen?`, 'Der Eintrag verschwindet aus der Auswahl. Bereits eingetragene Tage behalten ihn.', 'Entfernen')){
      S.data[list].splice(+ds.idx, 1); save(); renderMehr();
    }
    return;
  }
  switch (ds.act){
    case 'prev': S.date = addDays(S.date, -1); renderTag(); break;
    case 'next': if (S.date < today()){ S.date = addDays(S.date, 1); renderTag(); } break;
    case 'today': S.date = today(); renderTag(); break;
    case 'addsym': {
      const s = await askText('Eigenes Symptom', 'z. B. Gelenkschmerzen');
      if (s && !allSymptoms().includes(s)){ S.data.customSymptoms.push(s); save(); }
      renderTag(); break;
    }
    case 'addmove': {
      const s = await askText('Eigene Bewegungsart', 'z. B. Wandern');
      if (s && !allMoves().includes(s)){ S.data.customMoves.push(s); save(); }
      renderTag(); break;
    }
    case 'addmed': {
      const s = await askText('Medikament', 'z. B. Ibuprofen 400 oder Vitamin D');
      if (s && !S.data.meds.includes(s)){ S.data.meds.push(s); save(); }
      render(); break;
    }
    case 'mprev': S.month = new Date(S.month.getFullYear(), S.month.getMonth()-1, 1); renderKal(); break;
    case 'mnext': S.month = new Date(S.month.getFullYear(), S.month.getMonth()+1, 1); renderKal(); break;
    case 'mtoday': { const n = new Date(); S.month = new Date(n.getFullYear(), n.getMonth(), 1); renderKal(); break; }
    case 'export': exportBackup(); break;
    case 'changepw': changePassword(); break;
    case 'wipe': wipeAll(); break;
    case 'lock': lock(); break;
  }
});

$('#app').addEventListener('input', ev => {
  const t = ev.target; if (!S.data) return;
  if (t.id === 'note') setEntry(S.date, { note:t.value });
  else if (t.id === 'sleepH') setEntry(S.date, { sleepH:t.value.replace(',', '.').trim() });
  else if (t.id === 'moveMin') setEntry(S.date, { moveMin:t.value.replace(/[^0-9]/g, '') });
});
$('#app').addEventListener('change', ev => {
  const t = ev.target; if (!S.data) return;
  if (t.id === 'autolock'){ S.data.settings.autoLock = +t.value; save(); }
  else if (t.id === 'importFile'){ const f = t.files[0]; t.value = ''; if (f) importFile(f, 'merge'); }
});

/* Auto-Sperre */
['pointerdown','keydown','touchstart','scroll'].forEach(e => document.addEventListener(e, () => S.lastAct = Date.now(), { passive:true }));
const lockAfter = () => S.data ? S.data.settings.autoLock * 60000 : Infinity;
setInterval(() => { if (S.key && S.data.settings.autoLock > 0 && Date.now() - S.lastAct > lockAfter()) lock(); }, 15000);
document.addEventListener('visibilitychange', () => {
  if (document.hidden){
    S.hiddenAt = Date.now();
    if (S.key){ if (S.data.settings.autoLock === 0) lock(); else saveNow(); }
  } else if (S.key && S.hiddenAt && Date.now() - S.hiddenAt > lockAfter()) lock();
});
window.addEventListener('pagehide', () => { saveNow(); });

/* Offline-Fähigkeit (nur wenn über https geladen) */
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(()=>{});

showLock();
</script>
